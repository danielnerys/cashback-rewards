services:
  postgres-compras:
    image: postgres:16
    environment:
      POSTGRES_DB: compras
      POSTGRES_USER: compras
      POSTGRES_PASSWORD: compras
    ports:
      - "5432:5432"
    volumes:
      - postgres-compras-data:/var/lib/postgresql/data

  postgres-cashback:
    image: postgres:16
    environment:
      POSTGRES_DB: cashback
      POSTGRES_USER: cashback
      POSTGRES_PASSWORD: cashback
    ports:
      - "5433:5432"
    volumes:
      - postgres-cashback-data:/var/lib/postgresql/data

  postgres-carteira:
    image: postgres:16
    environment:
      POSTGRES_DB: carteira
      POSTGRES_USER: carteira
      POSTGRES_PASSWORD: carteira
    ports:
      - "5434:5432"
    volumes:
      - postgres-carteira-data:/var/lib/postgresql/data

volumes:
  postgres-compras-data:
  postgres-cashback-data:
  postgres-carteira-data:
