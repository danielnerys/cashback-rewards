server:
  port: 8083

spring:
  application:
    name: carteira-service
  datasource:
    url: jdbc:postgresql://localhost:5434/carteira
    username: carteira
    password: carteira
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
